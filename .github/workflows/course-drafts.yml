name: Course draft generation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: API 조회와 계획만 실행하고 DB에는 저장하지 않기
        required: false
        default: false
        type: boolean
      limit:
        description: 생성할 후보 수(1~3)
        required: false
        default: '3'
        type: string
  schedule:
    # Monday 04:00 KST = Sunday 19:00 UTC.
    - cron: '0 19 * * 0'

permissions:
  contents: read

concurrency:
  group: course-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate_count: ${{ steps.generate.outputs.candidate_count }}
      written_count: ${{ steps.generate.outputs.written_count }}
      mode: ${{ steps.generate.outputs.mode }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL secret is required}"
          : "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY secret is required}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY secret is required}"

      - name: Generate unpublished drafts
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.dry_run || 'false' }}" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "${{ inputs.limit || '' }}" ]]; then args+=(--limit "${{ inputs.limit }}"); fi
          npm run course:drafts -- "${args[@]}"

      - name: Verify generated data
        if: always()
        run: npm run course:verify

      - name: Verify public boundary
        if: always()
        run: npm run public:verify

  notify:
    runs-on: ubuntu-latest
    needs: drafts
    if: always()
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_NOTIFICATION_TITLE: 달빛수원 코스 초안 생성
      DISCORD_NOTIFICATION_STATUS: ${{ needs.drafts.result }}
      DISCORD_NOTIFICATION_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DISCORD_DRAFT_CANDIDATES: ${{ needs.drafts.outputs.candidate_count || '0' }}
      DISCORD_DRAFT_WRITTEN: ${{ needs.drafts.outputs.written_count || '0' }}
      DISCORD_DRAFT_MODE: ${{ needs.drafts.outputs.mode || 'unknown' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Notify Discord
        if: always()
        continue-on-error: true
        run: npm run notify:discord
