name: Approved public data sync

on:
  workflow_dispatch:
    inputs:
      job:
        description: 동기화할 승인 API 작업
        required: true
        type: choice
        options: [photo, wellness, local_hub, related, durunubi, visitors, weather_short, weather_mid, bus_arrival]
      dry_run:
        description: 원천 조회와 검수만 실행
        type: boolean
        default: false
      limit:
        description: 전체 작업 처리 한도
        type: string
        default: ''
  schedule:
    - cron: '20 0,3,6,9,12,15,18,21 * * *'
    - cron: '40 9,21 * * *'
    - cron: '10 21 * * 6'
    - cron: '30 21 2 * *'

permissions:
  contents: read

concurrency:
  group: approved-public-data-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      - id: jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            jobs="[\"$INPUT_JOB\"]"
          else
            case "$EVENT_SCHEDULE" in
              '20 0,3,6,9,12,15,18,21 * * *') jobs='["weather_short"]' ;;
              '40 9,21 * * *') jobs='["weather_mid"]' ;;
              '10 21 * * 6') jobs='["photo","wellness","durunubi"]' ;;
              '30 21 2 * *') jobs='["local_hub","related","visitors"]' ;;
              *) echo "Unknown schedule" >&2; exit 1 ;;
            esac
          fi
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  sync:
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        job: ${{ fromJSON(needs.resolve.outputs.jobs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KTO_SERVICE_KEY: ${{ secrets.KTO_SERVICE_KEY }}
      KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
      GG_BUS_SERVICE_KEY: ${{ secrets.GG_BUS_SERVICE_KEY }}
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate required server secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXT_PUBLIC_SUPABASE_URL:?required}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?required}"
          : "${KTO_SERVICE_KEY:?required compatibility key}"
      - name: Run approved source sync
        shell: bash
        run: |
          set -euo pipefail
          args=(--job "${{ matrix.job }}")
          if [[ "${{ inputs.dry_run || 'false' }}" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "${{ inputs.limit || '' }}" ]]; then args+=(--limit "${{ inputs.limit }}"); fi
          npm run sync:public-data -- "${args[@]}"
      - name: Verify source health
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: npm run data:verify -- --job "${{ matrix.job }}"
