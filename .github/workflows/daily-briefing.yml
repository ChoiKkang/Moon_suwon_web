name: Daily operations briefing

on:
  workflow_dispatch:
  schedule:
    # 09:00 KST = 00:00 UTC. 운영자가 하루를 시작할 때 확인할 수 있게 보낸다.
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.run.outputs.status }}
      action_count: ${{ steps.run.outputs.action_count }}
      watch_count: ${{ steps.run.outputs.watch_count }}
      body: ${{ steps.run.outputs.body }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL secret is required}"
          : "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY secret is required}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY secret is required}"

      - name: Build briefing
        id: run
        run: npm run briefing:daily

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 운영 브리핑"
            echo "- status: \`${{ steps.run.outputs.status || 'unknown' }}\`"
            echo "- 즉시 조치: ${{ steps.run.outputs.action_count || '0' }}건"
            echo "- 확인 권장: ${{ steps.run.outputs.watch_count || '0' }}건"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    runs-on: ubuntu-latest
    needs: briefing
    if: always()
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_NOTIFICATION_TITLE: 달빛수원 운영 브리핑
      DISCORD_NOTIFICATION_STATUS: ${{ needs.briefing.result == 'success' && (needs.briefing.outputs.status || 'healthy') || 'failed' }}
      DISCORD_NOTIFICATION_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DISCORD_NOTIFICATION_DETAILS: ${{ needs.briefing.result == 'success' && needs.briefing.outputs.body || '브리핑 생성에 실패했습니다. 실행 로그를 확인해 주세요.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Notify Discord
        if: always()
        continue-on-error: true
        run: npm run notify:discord
