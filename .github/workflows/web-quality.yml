name: Web quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build only needs the public configuration to compile. Production
      # credentials stay in Vercel/GitHub Actions and are never used by CI.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
      NEXT_PUBLIC_SITE_URL: https://example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Production build
        run: npm run build

  notify:
    runs-on: ubuntu-latest
    needs: verify
    # Do not expose the webhook secret to fork/unreviewed pull-request code.
    # Pushes to the protected main branch still produce a Discord result.
    if: always() && github.event_name != 'pull_request'
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_NOTIFICATION_TITLE: Moon Suwon web quality
      DISCORD_NOTIFICATION_STATUS: ${{ needs.verify.result }}
      DISCORD_NOTIFICATION_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DISCORD_NOTIFICATION_DETAILS: >-
        ref=${{ github.ref_name }} · commit=${{ github.sha }} ·
        trigger=${{ github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Notify Discord
        if: always()
        continue-on-error: true
        run: npm run notify:discord
