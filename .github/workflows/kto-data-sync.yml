name: KTO data sync

on:
  workflow_dispatch:
    inputs:
      job:
        description: 동기화할 데이터 영역
        required: true
        type: choice
        options:
          - content
          - crowd
          - pet
  schedule:
    # GitHub Actions cron is UTC (KST = UTC+9).
    - cron: '30 17 * * *'
    # Monday 03:00 KST = Sunday 18:00 UTC.
    - cron: '0 18 * * 0'
    # Run on the UTC dates that can contain the first day in KST, then guard
    # on Seoul's local date below so this is exactly the 1st at 04:00 KST.
    - cron: '0 19 28-31 * *'

permissions:
  contents: read

concurrency:
  # Keep all KTO jobs serial so a manual run cannot add API pressure while a
  # scheduled job is still processing.
  group: kto-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KTO_SERVICE_KEY: ${{ secrets.KTO_SERVICE_KEY }}
      # Keep Node's outbound KTO requests on IPv4; the local runner uses the
      # same setting and some hosted runner network paths fail over IPv6.
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Supabase JS initializes its Realtime client when createClient is
          # constructed. Node 22 supplies the native WebSocket implementation
          # expected by the current Supabase client.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve sync job
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            job="$INPUT_JOB"
          else
            case "$EVENT_SCHEDULE" in
              '30 17 * * *') job='crowd' ;;
              '0 18 * * 0') job='pet' ;;
              '0 19 28-31 * *') job='content' ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          fi

          case "$job" in
            content|crowd|pet) ;;
            *) echo "Unknown sync job: $job" >&2; exit 1 ;;
          esac

          should_run=true
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$job" == "content" ]]; then
            seoul_day="$(TZ=Asia/Seoul date +%d)"
            if [[ "$seoul_day" != "01" ]]; then
              should_run=false
              echo "Skipping monthly content sync: Seoul local date is day $seoul_day"
            fi
          fi

          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Running sync job: $job"

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL secret is required}"
          : "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY secret is required}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY secret is required}"
          : "${KTO_SERVICE_KEY:?KTO_SERVICE_KEY secret is required}"

      - name: Run sync
        if: steps.resolve.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          job="${{ steps.resolve.outputs.job }}"
          for attempt in 1 2 3; do
            echo "Starting $job sync (attempt $attempt/3)"
            if npm run sync:data -- --job "$job"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 15))
              echo "Sync failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          echo "KTO $job sync failed after 3 attempts" >&2
          exit 1

      - name: Verify data health
        if: always() && steps.resolve.outputs.should_run == 'true'
        run: npm run data:verify -- --job "${{ steps.resolve.outputs.job }}"

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## KTO data sync"
            echo "- resolved job: \`${{ steps.resolve.outputs.job }}\`"
            echo "- should run: \`${{ steps.resolve.outputs.should_run }}\`"
            echo "- workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [[ "${{ steps.resolve.outputs.should_run }}" != "true" ]]; then
              echo "- result: skipped by Seoul local-date guard"
            elif [[ "${{ job.status }}" == "success" ]]; then
              echo "- result: sync and serving health checks passed"
            else
              echo "- result: failed; inspect the sync run and error rows in the admin operations console"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
