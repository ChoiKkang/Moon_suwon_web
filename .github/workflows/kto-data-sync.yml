name: KTO data sync

on:
  workflow_dispatch:
    inputs:
      job:
        description: 동기화할 데이터 영역
        required: true
        type: choice
        options:
          - content
          - events
          - crowd
          - pet
          - access
          - audio
      dry_run:
        description: API 조회만 하고 DB에는 저장하지 않기
        required: false
        default: false
        type: boolean
      limit:
        description: 미리보기 항목 제한(비워두면 전체)
        required: false
        default: ''
        type: string
  schedule:
    # GitHub Actions cron is UTC (KST = UTC+9).
    - cron: '30 17 * * *'
    - cron: '0 17 * * *'
    - cron: '30 18 * * *'
    # Sunday 03:00 KST = Saturday 18:00 UTC.
    - cron: '0 18 * * 6'
    # Sunday 04:00 KST = Saturday 19:00 UTC. Runs after the weekly content sync
    # so newly published places get their accessibility data in the same night.
    - cron: '0 19 * * 6'
    # Sunday 05:00 KST = Saturday 20:00 UTC. 오디오 해설은 공개 장소 좌표로
    # 이어지므로 주간 콘텐츠 수집 뒤에 돌려야 새로 공개한 장소에도 붙는다.
    - cron: '0 20 * * 6'

permissions:
  contents: read

concurrency:
  # Keep all KTO jobs serial so a manual run cannot add API pressure while a
  # scheduled job is still processing.
  group: kto-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      job: ${{ steps.resolve.outputs.job }}
      should_run: ${{ steps.resolve.outputs.should_run }}
      status: ${{ steps.run_sync.outputs.status }}
      items_fetched: ${{ steps.run_sync.outputs.items_fetched }}
      items_upserted: ${{ steps.run_sync.outputs.items_upserted }}
      error_count: ${{ steps.run_sync.outputs.error_count }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KTO_SERVICE_KEY: ${{ secrets.KTO_SERVICE_KEY }}
      # Keep Node's outbound KTO requests on IPv4; the local runner uses the
      # same setting and some hosted runner network paths fail over IPv6.
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Supabase JS initializes its Realtime client when createClient is
          # constructed. Node 22 supplies the native WebSocket implementation
          # expected by the current Supabase client.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve sync job
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            job="$INPUT_JOB"
          else
            case "$EVENT_SCHEDULE" in
              '30 17 * * *') job='crowd' ;;
              '0 17 * * *') job='events' ;;
              '30 18 * * *') job='pet' ;;
              '0 18 * * 6') job='content' ;;
              '0 19 * * 6') job='access' ;;
              '0 20 * * 6') job='audio' ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          fi

          case "$job" in
            content|events|crowd|pet|access|audio) ;;
            *) echo "Unknown sync job: $job" >&2; exit 1 ;;
          esac

          should_run=true

          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Running sync job: $job"

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL secret is required}"
          : "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY secret is required}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY secret is required}"
          : "${KTO_SERVICE_KEY:?KTO_SERVICE_KEY secret is required}"

      - name: Run sync
        id: run_sync
        if: steps.resolve.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          job="${{ steps.resolve.outputs.job }}"
          dry_run="${{ inputs.dry_run || 'false' }}"
          limit="${{ inputs.limit || '' }}"
          args=(--job "$job")
          if [[ "$dry_run" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$limit" ]]; then args+=(--limit "$limit"); fi
          for attempt in 1 2 3; do
            echo "Starting $job sync (attempt $attempt/3)"
            if npm run sync:data -- "${args[@]}"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 15))
              echo "Sync failed; retrying in ${delay}s" >&2
              sleep "$delay"
            fi
          done
          echo "KTO $job sync failed after 3 attempts" >&2
          exit 1

      - name: Verify data health
        if: always() && steps.resolve.outputs.should_run == 'true'
        run: npm run data:verify -- --job "${{ steps.resolve.outputs.job }}"

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## KTO data sync"
            echo "- resolved job: \`${{ steps.resolve.outputs.job }}\`"
            echo "- should run: \`${{ steps.resolve.outputs.should_run }}\`"
            echo "- workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [[ "${{ steps.resolve.outputs.should_run }}" != "true" ]]; then
              echo "- result: skipped by Seoul local-date guard"
            elif [[ "${{ job.status }}" == "success" ]]; then
              echo "- result: sync and serving health checks passed"
            else
              echo "- result: failed; inspect the sync run and error rows in the admin operations console"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    runs-on: ubuntu-latest
    needs: sync
    if: always()
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_NOTIFICATION_TITLE: Moon Suwon KTO data sync
      DISCORD_NOTIFICATION_STATUS: ${{ needs.sync.result }}
      DISCORD_NOTIFICATION_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DISCORD_NOTIFICATION_DETAILS: >-
        job=${{ needs.sync.outputs.job || 'unknown' }} · should_run=${{ needs.sync.outputs.should_run || 'unknown' }} ·
        status=${{ needs.sync.outputs.status || needs.sync.result }} · fetched=${{ needs.sync.outputs.items_fetched || '0' }} ·
        upserted=${{ needs.sync.outputs.items_upserted || '0' }} · errors=${{ needs.sync.outputs.error_count || '0' }} · commit=${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Notify Discord
        if: always()
        continue-on-error: true
        run: npm run notify:discord
