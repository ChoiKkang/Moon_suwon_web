name: KTO data sync

on:
  workflow_dispatch:
    inputs:
      job:
        description: 동기화할 데이터 영역
        required: true
        type: choice
        options:
          - content
          - crowd
          - pet
  schedule:
    # GitHub Actions cron is UTC (KST = UTC+9).
    - cron: '30 17 * * *'
    - cron: '0 18 * * 1'
    - cron: '0 19 1 * *'

permissions:
  contents: read

concurrency:
  # Keep all KTO jobs serial so a manual run cannot add API pressure while a
  # scheduled job is still processing.
  group: kto-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KTO_SERVICE_KEY: ${{ secrets.KTO_SERVICE_KEY }}
      # Keep Node's outbound KTO requests on IPv4; the local runner uses the
      # same setting and some hosted runner network paths fail over IPv6.
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Supabase JS initializes its Realtime client when createClient is
          # constructed. Node 22 supplies the native WebSocket implementation
          # expected by the current Supabase client.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve sync job
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            job="$INPUT_JOB"
          else
            case "$EVENT_SCHEDULE" in
              '30 17 * * *') job='crowd' ;;
              '0 18 * * 1') job='pet' ;;
              '0 19 1 * *') job='content' ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          fi

          case "$job" in
            content|crowd|pet) ;;
            *) echo "Unknown sync job: $job" >&2; exit 1 ;;
          esac

          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "Running sync job: $job"

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL secret is required}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY secret is required}"
          : "${KTO_SERVICE_KEY:?KTO_SERVICE_KEY secret is required}"

      - name: Run sync
        run: npm run sync:data -- --job "${{ steps.resolve.outputs.job }}"
