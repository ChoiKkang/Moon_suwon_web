<div class="fixed inset-0 pointer-events-none z-0" id="stars-container"></div>
<script>
        // Micro-interaction: Particle stars
        const starsContainer = document.getElementById('stars-container');
        const starCount = 30;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            const size = Math.random() * 2 + 1;
            star.className = 'absolute bg-white rounded-full opacity-0';
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            
            // Animation properties
            const duration = 3000 + Math.random() * 5000;
            const delay = Math.random() * 5000;
            
            star.animate([
                { opacity: 0 },
                { opacity: Math.random() * 0.6 + 0.2 },
                { opacity: 0 }
            ], {
                duration: duration,
                delay: delay,
                iterations: Infinity,
                easing: 'ease-in-out'
            });
            
            starsContainer.appendChild(star);
        }

        // Logic Functions
        function handleLogin(provider) {
            // Flash effect for feedback
            const btn = event.currentTarget;
            btn.style.opacity = '0.7';
            setTimeout(() => btn.style.opacity = '1', 150);
        }

        function handleGuest() {
            // Seamless transition simulation
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = '0';
            setTimeout(() => {
                // Navigate or refresh logic would go here
                alert('비회원으로 시작합니다.');
                document.body.style.opacity = '1';
            }, 600);
        }
    </script>
